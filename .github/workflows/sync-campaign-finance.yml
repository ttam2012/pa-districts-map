name: Sync campaign finance data

on:
  schedule:
    # Campaign finance filings come in continuously (not on a fixed weekly
    # schedule like voter registration), so check daily.
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sync script
        id: sync
        run: python scripts/sync_campaign_finance.py

      - name: Commit and push if changed
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "campaign-finance-sync-bot"
          git config user.email "actions@github.com"
          git add pa-districts-map.html
          # The script's own changed=true is a hint, not a guarantee (e.g. a
          # regenerated-but-byte-identical file); verify an actual staged
          # diff exists before committing, so a false positive can't fail
          # the job with "nothing to commit".
          if git diff --staged --quiet; then
            echo "No actual file changes despite changed=true -- skipping commit."
            exit 0
          fi
          git commit -m "Sync campaign finance data as of ${{ steps.sync.outputs.as_of }}"
          git push
